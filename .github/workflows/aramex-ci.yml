name: Aramex CI

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Katalon test suite to execute
        required: true
        type: choice
        default: Test Suites/CCI_APM_CCIPH-652_SUITE_BUG_DONE_RETRY_20261020
        options:
          - Test Suites/ChargeCreation-TEST_SUITE
          - Test Suites/B2B-Shipment-TEST_SUITE
          - Test Suites/ShipmentCreation-TEST_SUITE
          - Test Suites/AP-TEST_SUITE
          - Test Suites/AP
          - Test Suites/AR-TEST_SUITE
          - Test Suites/Upload_Estimate_Actuals-TEST_SUITE
          - Test Suites/CustomSearch_360ViewScreen-TEST_SUITE
          - Test Suites/Feedback_PatchRelease-TEST_SUITE
          - Test Suites/CCI_APM_CCIPH-104_SUITE
          - Test Suites/CCI_APM_CCIPH-634_SUITE
          - Test Suites/CCI_APM_CCIPH-634_SUITE_BUG_DONE_RETRY_20261019
          - Test Suites/CCI_APM_CCIPH-652_SUITE
          - Test Suites/CCI_APM_CCIPH-652_SUITE_BUG_DONE_RETRY_20261020
          - Test Suites/GL-TEST_SUITE
          - Test Suites/EP-TEST_SUITE
          - Test Suites/EP-AR-TEST_SUITE
          - Test Suites/CCIPH-225
          - Test Suites/TEST-SUITE
          - Test Suites/FinalTestSuite
          - "Test Suites/Roles&Permission-TEST_SUITE"
      environment:
        description: Execution environment
        required: true
        type: choice
        default: dev
        options:
          - default
          - dev
          - staging

jobs:
  ci:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate Katalon project
        shell: powershell
        env:
          TEST_SUITE: ${{ github.event.inputs.test_suite || 'Test Suites/ChargeCreation-TEST_SUITE' }}
          EXECUTION_PROFILE: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          $requiredFiles = @(
            "Corp.microservice.ccm-automation.prj",
            "$env:TEST_SUITE.ts",
            "Profiles/$env:EXECUTION_PROFILE.glbl"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -Path $file -PathType Leaf)) {
              throw "Required Katalon file is missing: $file"
            }
          }
          Write-Output "Suite: $env:TEST_SUITE"
          Write-Output "Environment: $env:EXECUTION_PROFILE"

      - name: Require Katalon API key
        shell: powershell
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KATALON_API_KEY)) {
            throw "KATALON_API_KEY is not configured. Add it as a repository secret."
          }

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Katalon project
        shell: powershell
        run: |
          if (-not (Test-Path -Path Keywords -PathType Container)) {
            throw "Keywords folder is missing."
          }
          if (-not (Test-Path -Path Corp.microservice.ccm-automation.prj -PathType Leaf)) {
            throw "Katalon project file is missing."
          }
          Remove-Item -Path .project -Force -ErrorAction SilentlyContinue
          $unusedProjects = Join-Path $env:RUNNER_TEMP "unused-katalon-projects"
          New-Item -Path $unusedProjects -ItemType Directory -Force | Out-Null
          if (Test-Path -Path Dummy-Test.prj -PathType Leaf) {
            Move-Item -Path Dummy-Test.prj -Destination $unusedProjects -Force
          }

      - name: Run Katalon Runtime Engine
        uses: katalon-studio/katalon-studio-github-action@v4.0
        with:
          version: "11.5.0"
          projectPath: ${{ github.workspace }}/Corp.microservice.ccm-automation.prj
          args: >-
            -noSplash
            -retry=0
            -testSuitePath="${{ github.event.inputs.test_suite || 'Test Suites/ChargeCreation-TEST_SUITE' }}"
            -executionProfile="${{ github.event.inputs.environment || 'dev' }}"
            -browserType="Chrome (headless)"
            -apiKey=${{ secrets.KATALON_API_KEY }}
            --config
            -webui.autoUpdateDrivers=true
