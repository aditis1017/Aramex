name: Aramex CI

on:
  push:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Katalon test suite to execute
        required: true
        type: choice
        default: Test Suites/ChargeCreation-TEST_SUITE
        options:
          - Test Suites/ChargeCreation-TEST_SUITE
          - Test Suites/B2B-Shipment-TEST_SUITE
          - Test Suites/ShipmentCreation-TEST_SUITE
          - Test Suites/AP-TEST_SUITE
          - Test Suites/AP
          - Test Suites/AR-TEST_SUITE
          - Test Suites/Upload_Estimate_Actuals-TEST_SUITE
          - Test Suites/CustomSearch_360ViewScreen-TEST_SUITE
          - Test Suites/Feedback_PatchRelease-TEST_SUITE
          - Test Suites/CCI_APM_CCIPH-104_SUITE
          - Test Suites/CCI_APM_CCIPH-634_SUITE
          - Test Suites/GL-TEST_SUITE
          - Test Suites/EP-TEST_SUITE
          - Test Suites/EP-AR-TEST_SUITE
          - Test Suites/CCIPH-225
          - Test Suites/TEST-SUITE
          - Test Suites/FinalTestSuite
          - "Test Suites/Roles&Permission-TEST_SUITE"
      environment:
        description: Execution environment
        required: true
        type: choice
        default: dev
        options:
          - default
          - dev
          - staging

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Katalon project
        env:
          TEST_SUITE: ${{ github.event.inputs.test_suite || 'Test Suites/ChargeCreation-TEST_SUITE' }}
          EXECUTION_PROFILE: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          test -f Corp.microservice.ccm-automation.prj
          test -f "$TEST_SUITE.ts"
          test -f "Profiles/$EXECUTION_PROFILE.glbl"
          echo "Suite: $TEST_SUITE"
          echo "Environment: $EXECUTION_PROFILE"

      - name: Require Katalon API key
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        run: |
          if [ -z "$KATALON_API_KEY" ]; then
            echo "KATALON_API_KEY is not configured. Add it as a repository secret."
            exit 1
          fi

      - name: Run Katalon Runtime Engine
        uses: katalon-studio/katalon-studio-github-action@v4.0
        with:
          version: "11.6.0"
          projectPath: ${{ github.workspace }}
          args: >-
            -noSplash
            -retry=0
            -testSuitePath="${{ github.event.inputs.test_suite || 'Test Suites/ChargeCreation-TEST_SUITE' }}"
            -executionProfile="${{ github.event.inputs.environment || 'dev' }}"
            -browserType="Chrome (headless)"
            -apiKey=${{ secrets.KATALON_API_KEY }}
            --config
            -webui.autoUpdateDrivers=true
