databaseChangeLog:
  - changeSet:
      id: 025-dom-entity-category-values-v1
      author: custom-charges
      comment: Add DOM_ENTITY category and DOM_ENTITY_SA (RUH) category value
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: category
        - tableExists:
            tableName: category_value
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*)
              FROM category_value
              WHERE code = 'DOM_ENTITY_SA'
      changes:
        - sqlFile:
            path: sql/025-dom-entity-category-values.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/025-dom-entity-category-values-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
