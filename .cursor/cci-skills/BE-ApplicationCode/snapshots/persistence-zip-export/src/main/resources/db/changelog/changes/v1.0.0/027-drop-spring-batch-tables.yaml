databaseChangeLog:
  - changeSet:
      id: 027-drop-spring-batch-tables-v1
      author: custom-charges
      comment: Drop unused Spring Batch metadata tables and sequences
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: BATCH_JOB_INSTANCE
      changes:
        - sqlFile:
            path: sql/027-drop-spring-batch-tables.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/027-drop-spring-batch-tables-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
