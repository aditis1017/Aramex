databaseChangeLog:
  - changeSet:
      id: 033-global-setting-criteria-seed-v1
      author: custom-charges
      comment: Seed SA global_setting rules and global_rule_criteria
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: global_setting
        - tableExists:
            tableName: global_rule_criteria
        - sqlCheck:
            expectedResult: 1
            sql: SELECT CASE WHEN COUNT(*) <= 3 THEN 1 ELSE 0 END FROM global_setting
      changes:
        - sqlFile:
            path: sql/033-global-setting-criteria-seed.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
            endDelimiter: "\nGO"
      rollback:
        - sqlFile:
            path: sql/033-global-setting-criteria-seed-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
