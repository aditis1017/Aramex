databaseChangeLog:
  - changeSet:
      id: 026-shipment-account-business-type-v1
      author: custom-charges
      comment: Add shipment.account_business_type for AR-derived business type
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: shipment
        - not:
            columnExists:
              tableName: shipment
              columnName: account_business_type
      changes:
        - sqlFile:
            path: sql/026-shipment-account-business-type.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/026-shipment-account-business-type-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
