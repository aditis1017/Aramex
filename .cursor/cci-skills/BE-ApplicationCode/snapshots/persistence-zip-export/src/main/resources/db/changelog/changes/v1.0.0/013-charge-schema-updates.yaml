databaseChangeLog:
  - changeSet:
      id: 013-charge-schema-updates-v1
      author: custom-charges
      comment: Charge and account schema updates (040, 041, 042, 043, 044, 048, 049)
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            columnExists:
              tableName: charge
              columnName: shipping_charges
      changes:
        - sqlFile:
            path: sql/013-charge-schema-updates.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/013-charge-schema-updates-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
