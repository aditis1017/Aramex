databaseChangeLog:
  - changeSet:
      id: 009-service-charge-mapping-seed-v1
      author: custom-charges
      comment: Seed global service_charge_mapping rows (DTA to ECS/EC3)
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: service_codes
        - tableExists:
            tableName: service_charge_mapping
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*) FROM service_charge_mapping m
              JOIN service_codes src ON m.from_service_code = src.id
              JOIN service_codes tgt ON m.to_service_code = tgt.id
              WHERE src.service_code = 'Cost'
                AND src.charge_type = 'DTA'
                AND tgt.service_code = 'Cost'
                AND tgt.charge_type = 'ECS'
                AND m.from_entity = 'Global'
                AND m.to_entity = 'Global'
                AND m.charge_type = 'ECS'
      changes:
        - sqlFile:
            path: sql/009-service-charge-mapping-seed.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/009-service-charge-mapping-seed-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
