databaseChangeLog:
  - changeSet:
      id: 034-got-service-codes-insert-v1
      author: custom-charges
      comment: Insert GOT service_codes present in Customer data but missing in DB
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: service_codes
      changes:
        - sqlFile:
            path: sql/034-got-service-codes-insert.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/034-got-service-codes-insert-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
