databaseChangeLog:
  - changeSet:
      id: 030-ap-account-vendor-seed-v1
      author: custom-charges
      comment: Seed AP vendor accounts (KSA Customs for RUH/JED/DHA, ASL001 for others)
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: entity
        - tableExists:
            tableName: ap_account
        - tableExists:
            tableName: account
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM ap_account
      changes:
        - sqlFile:
            path: sql/030-ap-account-vendor-seed.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/030-ap-account-vendor-seed-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
