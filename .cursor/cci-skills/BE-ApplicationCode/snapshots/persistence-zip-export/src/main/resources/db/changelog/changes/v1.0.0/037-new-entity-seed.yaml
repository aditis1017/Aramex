databaseChangeLog:
  - changeSet:
      id: 037-new-entity-seed-v1
      author: custom-charges
      comment: Insert new entities from NewEntityList.csv not present in 004-entity-seed
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: entity
        - tableExists:
            tableName: country
      changes:
        - sqlFile:
            path: sql/037-new-entity-seed.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/037-new-entity-seed-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
