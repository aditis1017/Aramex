databaseChangeLog:
  - changeSet:
      id: 024-shipment-commodity-description-text-v1
      author: custom-charges
      comment: Widen shipment.commodity_description from VARCHAR to TEXT when not already TEXT
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: shipment
        - columnExists:
            tableName: shipment
            columnName: commodity_description
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT CASE WHEN COUNT(*) > 0 THEN 1 ELSE 0 END
              FROM information_schema.columns
              WHERE table_schema = current_schema()
                AND table_name = 'shipment'
                AND column_name = 'commodity_description'
                AND udt_name <> 'text'
      changes:
        - sqlFile:
            path: sql/024-shipment-commodity-description-text.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/024-shipment-commodity-description-text-rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
