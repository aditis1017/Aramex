databaseChangeLog:
  - changeSet:
      id: 029-rate-sheet-ruh-jed-dha-seed-v1
      author: custom-charges
      comment: Seed rate sheets and items for RUH/JED/DHA ENTITY_SETTINGS (DTC/DTA/ECD)
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: account
        - tableExists:
            tableName: rate_sheet
        - tableExists:
            tableName: rate_sheet_item
        - tableExists:
            tableName: rate_sheet_item_rate
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM rate_sheet_item
      changes:
        - sqlFile:
            path: sql/029-rate-sheet-ruh-jed-dha-seed.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/029-rate-sheet-ruh-jed-dha-seed-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
