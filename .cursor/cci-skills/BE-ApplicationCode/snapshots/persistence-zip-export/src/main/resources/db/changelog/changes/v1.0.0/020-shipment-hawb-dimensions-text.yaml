databaseChangeLog:
  - changeSet:
      id: 020-shipment-hawb-dimensions-text-v1
      author: custom-charges
      comment: Widen shipment.hawb_dimensions from VARCHAR to TEXT when not already TEXT
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: shipment
        - columnExists:
            tableName: shipment
            columnName: hawb_dimensions
      changes:
        - sqlFile:
            path: sql/020-shipment-hawb-dimensions-text.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/020-shipment-hawb-dimensions-text-rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
