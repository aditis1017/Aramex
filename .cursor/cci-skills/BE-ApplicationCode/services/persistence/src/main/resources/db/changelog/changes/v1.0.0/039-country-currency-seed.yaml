databaseChangeLog:
  - changeSet:
      id: 039-country-currency-seed-v2
      author: custom-charges
      comment: Seed countries and currencies from init-entity/init-currency missing in 004/006
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: country
        - tableExists:
            tableName: currency
      changes:
        - sqlFile:
            path: sql/039-country-currency-seed.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/039-country-currency-seed-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
