databaseChangeLog:
  - changeSet:
      id: 017-account-charge-config-unique-v2
      author: custom-charges
      comment: Enforce one charge-config account row per AR/AP master and charge type (DTA, DTS, DT3, etc.)
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: account
      changes:
        - sqlFile:
            path: sql/017-account-charge-config-unique.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/017-account-charge-config-unique-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
