databaseChangeLog:
  - changeSet:
      id: 018-charge-account-type-v1
      author: custom-charges
      comment: Add account_type on charge for billing classification
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            columnExists:
              tableName: charge
              columnName: account_type
      changes:
        - sqlFile:
            path: sql/018-charge-account-type.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: sql/018-charge-account-type-rollback.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
