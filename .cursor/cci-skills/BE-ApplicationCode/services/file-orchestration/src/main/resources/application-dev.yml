server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: ${CONTEXT_PATH:/fileorchestration}

javers:
  sqlSchemaManagementEnabled: ${JAVERS_SCHEMA_ENABLED:false}

logging:
  level:
    org.apache.poi.xssf.eventusermodel.XSSFSheetXMLHandler: WARN
    org.apache.poi: WARN
management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
customcharge:
  record-tracking:
    enabled: ${RECORD_TRACKING_ENABLED:true}
    log-record-completed: ${RECORD_TRACKING_LOG_RECORD_COMPLETED:false}
  metrics:
    file-processing:
      enabled: ${METRICS_FILE_PROCESSING_ENABLED:true}
    snapshot:
      enabled: ${METRICS_SNAPSHOT_ENABLED:true}
      interval-ms: ${METRICS_SNAPSHOT_INTERVAL_MS:60000}

spring:
  application:
    name: fileOrchestration
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:60s}
  cloud:
    aws:
      sqs:
        listener:
          max-concurrent-messages: ${BATCH_LISTENER_CONCURRENCY:2}
          max-messages-per-poll: ${BATCH_LISTENER_CONCURRENCY:2}
  liquibase:
    enabled: false

mvp:
  persistence:
    datasource:
      url: ${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rules}?currentSchema=${DB_SCHEMA:public}}
      username: ${DATASOURCE_USERNAME:postgres}
      password: ${DATASOURCE_PASSWORD:postgres}
      driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATASOURCE_MIN_IDLE:2}
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:password}
      port: ${REDIS_PORT:6379}
    jpa:
      enabled: ${JPA_ENABLED:true}
      ddl-auto: ${JPA_DDL_AUTO:validate}
      show-sql: ${JPA_SHOW_SQL:true}
      default_schema: ${DB_SCHEMA:public}
    javers:
      enabled: ${JAVERS_ENABLED:true}
    drools:
      enabled: ${DROOLS_ENABLED:false}
    security:
      entra:
        enabled: ${ENTRA_SECURITY_ENABLED:true}
        public-paths:
          - /health
          - /health/**
          - /fileorchestration/health
          - /fileorchestration/health/**
          - /actuator/**
          - /fileorchestration/actuator/**
          - /fileorchestration/swagger-ui/**
          - /fileorchestration/v3/api-docs/**
          - /swagger-ui/**
          - /v3/api-docs/**
          - /api/auth/logout
          - /fileorchestration/api/auth/logout
    swagger:
      enabled: ${SWAGGER_ENABLED:true}
      title: ${SWAGGER_TITLE:API Documentation}
      description: ${SWAGGER_DESCRIPTION:API Description}
      version: ${SWAGGER_VERSION:1.0.0}
      server-url: ${SWAGGER_SERVER_URL:https://dev-cc.aramex.com}${CONTEXT_PATH:/fileorchestration}
    aws:
      sqs:
        enabled: ${AWS_SQS_ENABLED:true}
        region: ${AWS_REGION:ap-south-1}
        accessKey: ${AWS_ACCESS_KEY_ID:}
        secretKey: ${AWS_SECRET_ACCESS_KEY:}
        endpoint: ${AWS_SQS_ENDPOINT:}
      s3:
        enabled: ${AWS_S3_ENABLED:true}
        region: ${AWS_REGION:ap-south-1}
        accessKey: ${AWS_ACCESS_KEY_ID:}
        secretKey: ${AWS_SECRET_ACCESS_KEY:}
        default-bucket: ${S3_DEFAULT_BUCKET:}
      ses:
        enabled: ${AWS_SES_ENABLED:false}

file-orchestration:
  batch:
    input-queue: ${FILE_INFO_QUEUE:custom-charge-file-input}
    output-queue: ${FILE_DATA_QUEUE:custom-charge-file-output}
    chunk-size: ${BATCH_CHUNK_SIZE:100}
    listener-concurrency: ${BATCH_LISTENER_CONCURRENCY:1}
    dedup-enabled: ${BATCH_DEDUP_ENABLED:true}
    redis-ttl-seconds: ${FILE_PROCESS_REDIS_TTL:1800}
    heartbeat-every-chunks: ${FILE_PROCESS_HEARTBEAT_CHUNKS:25}
    publish-max-attempts: ${FILE_PROCESS_PUBLISH_ATTEMPTS:3}
    publish-backoff-millis: ${FILE_PROCESS_PUBLISH_BACKOFF_MS:200}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
      - http://dev-cc.aramex.com
    allowed-methods:
      - "*"
    allowed-headers:
      - "*"
    allow-credentials: true
