server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/dashboard}
    session:
      cookie:
        http-only: true
        same-site: strict
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:200}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:10s}

# HttpOnly route RBAC cookie for Custom Charges FE (`proxy.ts` reads `ccfe_route_access`).
ccfe:
  route-access:
    cookie:
      name: ccfe_route_access
      path: ${CCFE_ROUTE_ACCESS_COOKIE_PATH:/}
      max-age-days: 7
      secure: ${CCFE_ROUTE_ACCESS_COOKIE_SECURE:true}
      same-site: Strict
  # Entra access tokens often exceed Tomcat's default ~8KB header limit (Authorization + cookies).
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
javers:
  sqlSchemaManagementEnabled: ${JAVERS_SCHEMA_ENABLED:true}

logging:
  level:
    org.apache.poi.xssf.eventusermodel.XSSFSheetXMLHandler: WARN
    org.apache.poi: WARN

springdoc:
  swagger-ui:
    persistAuthorization: true
spring:
  cache:
    type: redis
    redis:
      time-to-live: ${API_CACHE_TTL:10m}
      cache-null-values: false
      key-prefix: "dashboard-api::"
  application:
    name: dashboard-service
  profiles:
    active: ${ACTIVE_ENV:dev}

management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
