server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/dashboard}
    session:
      cookie:
        secure: true
  forward-headers-strategy: framework
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
javers:
  sqlSchemaManagementEnabled: ${JAVERS_SCHEMA_ENABLED:false}

management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    persistAuthorization: true

logging:
  level:
    org.apache.poi.xssf.eventusermodel.XSSFSheetXMLHandler: WARN
    org.apache.poi: WARN

spring:
  cache:
    type: redis
    redis:
      time-to-live: ${API_CACHE_TTL:10m}
      cache-null-values: false
      key-prefix: "dashboard-api::"
  application:
    name: dashboard-service
