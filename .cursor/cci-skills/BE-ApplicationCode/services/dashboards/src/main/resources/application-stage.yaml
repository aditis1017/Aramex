mvp:
  persistence:
    datasource:
      url: ${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:globalsettings}?currentSchema=${DB_SCHEMA:public}}
      username: ${DATASOURCE_USERNAME:postgres}
      password: ${DATASOURCE_PASSWORD:Tarundeep}
      driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${DATASOURCE_MIN_IDLE:5}
      routing:
        enabled: ${DATASOURCE_ROUTING_ENABLED:true}
        fallback-to-write: ${DATASOURCE_ROUTING_FALLBACK_TO_WRITE:true}
      write:
        url: ${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:globalsettings}?currentSchema=${DB_SCHEMA:public}}
        username: ${DATASOURCE_USERNAME:postgres}
        password: ${DATASOURCE_PASSWORD:Tarundeep}
        pool-name: ${DATASOURCE_WRITE_POOL_NAME:DashboardsWritePool}
        maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
        minimum-idle: ${DATASOURCE_MIN_IDLE:5}
      read:
        url: ${READ_DATASOURCE_URL:jdbc:postgresql://${READ_DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:globalsettings}?currentSchema=${DB_SCHEMA:public}}
        username: ${DATASOURCE_USERNAME:postgres}
        password: ${DATASOURCE_PASSWORD:Tarundeep}
        pool-name: ${DATASOURCE_READ_POOL_NAME:DashboardsReadPool}
        maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
        minimum-idle: ${DATASOURCE_MIN_IDLE:5}
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:}
      port: ${REDIS_PORT:6379}
    security:
      entra:
        enabled: ${ENTRA_SECURITY_ENABLED:true}
        public-paths:
          - /health
          - /health/**
          - /dashboard/health
          - /dashboard/health/**
          - /actuator/**
          - /dashboard/actuator/**
          - /dashboard/swagger-ui/**
          - /dashboard/v3/api-docs/**
          - /swagger-ui/**
          - /v3/api-docs/**
          - /api/auth/logout
          - /dashboard/api/auth/logout
    liquibase:
      enabled: ${LIQUIBASE_ENABLED:true}
    jpa:
      enabled: ${JPA_ENABLED:true}
      ddl-auto: ${JPA_DDL_AUTO:validate}
      show-sql: ${JPA_SHOW_SQL:true}
      default_schema: ${DB_SCHEMA:public}
    swagger:
      enabled: ${SWAGGER_ENABLED:true}
      title: ${SWAGGER_TITLE:API Documentation}
      description: ${SWAGGER_DESCRIPTION:API Description}
      version: ${SWAGGER_VERSION:1.0.0}
      server-url: ${SWAGGER_SERVER_URL:https://stage-cc.aramex.com}${CONTEXT_PATH:/dashboard}
    javers:
      enabled: ${JAVERS_ENABLED:true}
    export:
      enabled: ${EXPORT_ENGINE_ENABLED:true}
      chunk-size: ${EXPORT_CHUNK_SIZE:2000}
    drools:
      enabled: ${DROOLS_ENABLED:false}
    aws:
      sqs:
        enabled: ${AWS_SQS_ENABLED:true}
        region: ${AWS_REGION:ap-south-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
        endpoint: ${AWS_SQS_ENDPOINT:}
        queues:
          - name: ${BATCH_INPUT_QUEUE:custom-charge-file-input}
      s3:
        enabled: ${AWS_S3_ENABLED:true}
        region: ${AWS_REGION:ap-south-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
        endpoint: ${AWS_S3_ENDPOINT:}
        default-bucket: ${S3_DEFAULT_BUCKET:}

dashboard:
  file-upload: {}

app:
  cors:
    allowed-origins:
      - https://stage-cc.aramex.com
    allowed-methods:
      - "*"
    allowed-headers:
      - "*"
    allow-credentials: true
