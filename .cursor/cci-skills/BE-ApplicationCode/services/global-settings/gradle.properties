org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

sonar.projectKey=${SONAR_PROJECT_KEY}
sonar.projectName=${SONAR_PROJECT_KEY}
sonar.host.url=${SONAR_HOST_URL}
sonar.login=${SONAR_TOKEN}
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.source=21
sonar.java.binaries=build/classes/java/main
sonar.junit.reportPaths=build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.exclusions=**/config/**,**/dto/**,**/entity/**,**/*Application.class, **/GlobalSettingRepository.class, **/GlobalSettingService.class,**/DrlRuleConverter.class, Application**/*
sonar.gradle.skipCompile=true
jacoco.excludes=**/dto/**,Application**/*.class,**/GlobalSettingRepository.class,**/GlobalSettingService.class,**/DrlRuleConverter.class

persistenceVersion=0.1.1