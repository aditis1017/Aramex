plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.customcharge'
version = '0.1.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencyManagement {
	imports {
		mavenBom 'io.awspring.cloud:spring-cloud-aws-dependencies:3.4.2'
		mavenBom 'software.amazon.awssdk:bom:2.25.20'
	}
}

dependencies {
	implementation "com.customcharge:persistence-layer:${persistenceVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-logging'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation "org.javers:javers-spring-boot-starter-sql:7.5.0"
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
//	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.4.2'
	implementation("software.amazon.awssdk:s3")
	implementation("software.amazon.awssdk:sts")
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	implementation platform("org.drools:drools-bom:8.44.0.Final")
	implementation "org.kie:kie-api"
	implementation "org.drools:drools-core"
	implementation "org.drools:drools-compiler"
	implementation "org.drools:drools-mvel"
	implementation "org.drools:drools-templates"
	implementation "org.drools:drools-decisiontables:7.74.0.Final"
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

springBoot {
	buildInfo()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-parameters']
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = "0.8.13"
}

def jacocoExcludes = project.findProperty("jacoco.excludes")?.split(",") ?: []

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, exclude: jacocoExcludes)
			})
	)
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
	classDirectories.setFrom(jacocoTestReport.classDirectories)
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

tasks.named('sonarqube') {
	dependsOn test, jacocoTestReport
}

sonarqube {
	properties {
		property "sonar.projectKey", project.findProperty("sonar.projectKey")
		property "sonar.projectName", project.findProperty("sonar.projectName")
		property "sonar.host.url", project.findProperty("sonar.host.url")
		property "sonar.login", System.getenv("SONAR_TOKEN") ?: project.findProperty("sonar.login")
	}
}

tasks.register("printPersistenceVersion") {
	doLast {
		println project.findProperty("persistenceVersion")
	}
}