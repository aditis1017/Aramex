server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/shipment}
javers:
  sqlSchemaManagementEnabled: ${JAVERS_SCHEMA_ENABLED:true}

spring:
  liquibase:
    enabled: false
  application:
    name: shipment-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: 15000
    listener:
      simple:
        concurrency: ${SHIPMENT_LISTENER_MIN_CONCURRENCY:5}
        max-concurrency: ${SHIPMENT_LISTENER_MAX_CONCURRENCY:12}
        prefetch: ${SHIPMENT_LISTENER_PREFETCH:5}
        default-requeue-rejected: false
management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
queue:
  client-shipment: ${CLIENT_SHIPMENT_QUEUE:cci.chargeCreation.prod.5}

mvp:
  persistence:
    datasource:
      url: ${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:globalsettings}?currentSchema=${DB_SCHEMA:public}}
      username: ${DATASOURCE_USERNAME:postgres}
      password: ${DATASOURCE_PASSWORD:Tarundeep}
      driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${DATASOURCE_MIN_IDLE:5}
    redis:
      enabled: ${REDIS_ENABLED:true}
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:password}
      port: ${REDIS_PORT:6379}
    security:
      entra:
        enabled: ${ENTRA_SECURITY_ENABLED:false}
        public-paths:
          - /health
          - /health/**
          - /shipment/health
          - /shipment/health/**
          - /actuator/**
          - /shipment/actuator/**
    jpa:
      enabled: ${JPA_ENABLED:true}
      ddl-auto: none
      show-sql: ${JPA_SHOW_SQL:false}
      default_schema: ${DB_SCHEMA:public}
    exchange-rate:
      url: ${EXCHANGE_RATE_URL:http://devbe01.aramex.com/corp.shippingapi.coredata.v1/api/DataUtilities/GetExchangeRate}
      cache-ttl: ${EXCHANGE_RATE_CACHE_TTL:15h}
    rabbitmq:
      topology-config-location: classpath:rabbitmq.json
      enabled: false
    javers:
      enabled: ${JAVERS_ENABLED:true}
      async:
        enabled: ${JAVERS_ASYNC_ENABLED:true}
        pool-size: ${JAVERS_ASYNC_POOL_SIZE:8}
    drools:
      enabled: ${DROOLS_ENABLED:true}
    calculator-helper:
      enabled: ${CALCULATOR_HELPER_ENABLED:true}
    aws:
      lambda:
        enabled: false
      s3:
        enabled: false
      sqs:
        enabled: ${AWS_SQS_ENABLED:true}
        create-queues-on-startup: ${AWS_SQS_CREATE_QUEUES_ON_STARTUP:false}
        region: ${AWS_REGION:eu-north-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
        endpoint: ${AWS_SQS_ENDPOINT:}
        queue-config-location: classpath:sqs-queues.json

shipment:
  monetary-scale: ${SHIPMENT_MONETARY_SCALE:4}
  ingest:
    adapter:
      enabled: ${SHIPMENT_INGEST_ADAPTER_ENABLED:${SHIPMENT_SQS_BUFFER_ENABLED:false}}
      target-sqs-queue: ${SHIPMENT_SQS_INGEST_QUEUE:amx-customcharges-prod-sqs-shipment-ingest}
    worker:
      sqs-queue: ${SHIPMENT_SQS_INGEST_QUEUE:amx-customcharges-prod-sqs-shipment-ingest}
      listener-concurrency: ${SHIPMENT_SQS_LISTENER_CONCURRENCY:5}
  listener:
    min-concurrency: ${SHIPMENT_LISTENER_MIN_CONCURRENCY:5}
    max-concurrency: ${SHIPMENT_LISTENER_MAX_CONCURRENCY:12}
    prefetch: ${SHIPMENT_LISTENER_PREFETCH:5}

app:
  cors:
    allowed-origins:
      - https://cc.aramex.com
    allowed-methods:
      - "*"
    allowed-headers:
      - "*"
    allow-credentials: true
