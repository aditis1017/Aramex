server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/shipment}
  # Entra access tokens often exceed Tomcat's default ~8KB header limit (Authorization + cookies).
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
javers:
  sqlSchemaManagementEnabled: ${JAVERS_SCHEMA_ENABLED:true}

spring:
  liquibase:
    enabled: false
  application:
    name: shipment-service
  profiles:
    active: ${ACTIVE_ENV:dev}
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  cloud:
    aws:
      s3:
        enabled: false
      sqs:
        enabled: ${AWS_SQS_ENABLED:true}
        queue-not-found-strategy: fail
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${RABBITMQ_TIMEOUT:15000}
    listener:
      simple:
        concurrency: ${SHIPMENT_LISTENER_MIN_CONCURRENCY:5}
        max-concurrency: ${SHIPMENT_LISTENER_MAX_CONCURRENCY:12}
        prefetch: ${SHIPMENT_LISTENER_PREFETCH:10}
        default-requeue-rejected: false

management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

customcharge:
  metrics:
    shipment-ingest:
      enabled: ${METRICS_SHIPMENT_INGEST_ENABLED:true}
    snapshot:
      enabled: ${METRICS_SNAPSHOT_ENABLED:true}
      interval-ms: ${METRICS_SNAPSHOT_INTERVAL_MS:60000}

queue:
  client-shipment: ${RABBITMQ_QUEUE_NAME:HB_CCI_MSG5}

mvp:
  persistence:
    datasource:
      url: ${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:globalsettings}?currentSchema=${DB_SCHEMA:public}}
      username: ${DATASOURCE_USERNAME:postgres}
      password: ${DATASOURCE_PASSWORD:Tarundeep}
      driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${DATASOURCE_MIN_IDLE:5}
    redis:
      enabled: ${REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:password}
      port: ${REDIS_PORT:6379}
    security:
      entra:
        enabled: ${ENTRA_SECURITY_ENABLED:false}
        public-paths:
          - /health
          - /health/**
          - /shipment/health
          - /shipment/health/**
          - /actuator/**
          - /shipment/actuator/**
          - /api/auth/logout
          - /shipment/api/auth/logout
          - /api/auth/entra/lifecycle/user/deactivate
          - /dashboard/api/auth/entra/lifecycle/user/deactivate
          - /globalSettings/api/auth/entra/lifecycle/user/deactivate
          - /shipment/api/auth/entra/lifecycle/user/deactivate
    jpa:
      enabled: ${JPA_ENABLED:true}
      ddl-auto: validate
      show-sql: ${JPA_SHOW_SQL:false}
      default_schema: ${DB_SCHEMA:public}
    rabbitmq:
      topology-config-location: classpath:rabbitmq.json
      enabled: false
    javers:
      enabled: ${JAVERS_ENABLED:true}
      async:
        enabled: ${JAVERS_ASYNC_ENABLED:true}
        pool-size: ${JAVERS_ASYNC_POOL_SIZE:4}
    drools:
      enabled: ${DROOLS_ENABLED:true}
    calculator-helper:
      enabled: ${CALCULATOR_HELPER_ENABLED:true}
    aws:
      lambda:
        enabled: false
      s3:
        enabled: false
      sqs:
        enabled: ${AWS_SQS_ENABLED:true}
        create-queues-on-startup: ${AWS_SQS_CREATE_QUEUES_ON_STARTUP:true}
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
        endpoint: ${AWS_SQS_ENDPOINT:}
        queue-config-location: classpath:sqs-queues.json

shipment:
  monetary-scale: ${SHIPMENT_MONETARY_SCALE:4}
  ingest:
    adapter:
      enabled: ${SHIPMENT_INGEST_ADAPTER_ENABLED:${SHIPMENT_SQS_BUFFER_ENABLED:false}}
      enabledsqs: ${SHIPMENT_INGEST_SQS_ENABLED:true}
      target-sqs-queue: ${SHIPMENT_SQS_INGEST_QUEUE:custom-charges-shipment-ingest}
    worker:
      sqs-queue: ${SHIPMENT_SQS_INGEST_QUEUE:custom-charges-shipment-ingest}
      listener-concurrency: ${SHIPMENT_SQS_LISTENER_CONCURRENCY:5}
  listener:
    min-concurrency: ${SHIPMENT_LISTENER_MIN_CONCURRENCY:5}
    max-concurrency: ${SHIPMENT_LISTENER_MAX_CONCURRENCY:12}
    prefetch: ${SHIPMENT_LISTENER_PREFETCH:10}
  listener-matrix:
    trace-enabled: ${SHIPMENT_LISTENER_MATRIX_TRACE_ENABLED:true}
    trace-interval-ms: ${SHIPMENT_LISTENER_MATRIX_TRACE_INTERVAL_MS:60000}
    consumption-report-interval-ms: ${SHIPMENT_LISTENER_CONSUMPTION_REPORT_INTERVAL_MS:60000}
  observability:
    phase-timing-enabled: ${SHIPMENT_PHASE_TIMING_ENABLED:true}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
      - https://dev-cc.aramex.com
    allowed-methods:
      - "*"
    allowed-headers:
      - "*"
    allow-credentials: true
