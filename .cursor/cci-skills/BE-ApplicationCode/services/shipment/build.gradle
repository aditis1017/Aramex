plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '4.4.1.3373'
}

group = 'custom.charges'
version = '0.1.1'
description = 'Shipment project for Custom Charges'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencyManagement {
	imports {
		mavenBom 'io.awspring.cloud:spring-cloud-aws-dependencies:3.4.2'
	}
}

dependencies {
	implementation "com.customcharge:persistence-layer:${persistenceVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-logging'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation "org.javers:javers-spring-boot-starter-sql:7.5.0"

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.postgresql:postgresql:42.7.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.drools:drools-core:8.44.0.Final'
	implementation 'org.drools:drools-compiler:8.44.0.Final'
	implementation 'org.drools:drools-mvel:8.44.0.Final'
	implementation 'org.kie:kie-api:8.44.0.Final'

	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:3.4.2'
	implementation 'software.amazon.awssdk:sts'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
}

springBoot {
	buildInfo()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-parameters']
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = project.findProperty("jacoco.toolVersion") ?: "0.8.13"
}

def jacocoExcludes = project.findProperty("jacoco.excludes")
		?.split(",")
		?.collect { it.trim() }
		?.findAll { !it.isEmpty() }
		?: []

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, exclude: jacocoExcludes)
			})
	)
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
	classDirectories.setFrom(jacocoTestReport.classDirectories)
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

tasks.named('sonarqube') {
	dependsOn test, jacocoTestReport
}

sonarqube {
	properties {
		property "sonar.projectKey", project.findProperty("sonar.projectKey")
		property "sonar.projectName", project.findProperty("sonar.projectName")
		property "sonar.host.url", project.findProperty("sonar.host.url")
		property "sonar.login", System.getenv("SONAR_TOKEN") ?: project.findProperty("sonar.login")
		property "sonar.exclusions", project.findProperty("sonar.exclusions")
		property "sonar.coverage.exclusions", project.findProperty("sonar.coverage.exclusions")
	}
}

tasks.register("printPersistenceVersion") {
	doLast {
		println project.findProperty("persistenceVersion")
	}
}