plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '4.4.1.3373'
}

group = 'com.customcharge'
version = '0.1.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencyManagement {
	imports {
		mavenBom 'io.awspring.cloud:spring-cloud-aws-dependencies:3.4.2'
	}
}

dependencies {
		implementation "com.customcharge:persistence-layer:${persistenceVersion}"
        implementation 'org.springframework.boot:spring-boot-starter-logging'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'org.springframework.boot:spring-boot-starter-freemarker'
        implementation "org.javers:javers-spring-boot-starter-sql:7.5.0"
		implementation 'org.apache.poi:poi-ooxml:5.4.1'
        implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
        compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		implementation 'org.springframework.boot:spring-boot-starter-data-redis'

		implementation("software.amazon.awssdk:s3")
		implementation("software.amazon.awssdk:sts")
		implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'
		runtimeOnly 'org.postgresql:postgresql'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
	buildInfo()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-parameters']
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = "0.8.13"
}

def jacocoExcludes = (project.findProperty("jacoco.excludes") ?: "")
		.split(",")
		.collect { it.trim() }
		.findAll { !it.isEmpty() }

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, exclude: jacocoExcludes)
			})
	)
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
	classDirectories.setFrom(jacocoTestReport.classDirectories)
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

tasks.named('sonarqube') {
	dependsOn test, jacocoTestReport
}

sonarqube {
	properties {
		property "sonar.projectKey", project.findProperty("sonar.projectKey")
		property "sonar.projectName", project.findProperty("sonar.projectName")
		property "sonar.host.url", project.findProperty("sonar.host.url")
		property "sonar.login", System.getenv("SONAR_LOGIN") ?: project.findProperty("sonar.login")
		property "sonar.coverage.exclusions", project.findProperty("sonar.coverage.exclusions") ?: ""
	}
}

tasks.register("printPersistenceVersion") {
	doLast {
		println project.findProperty("persistenceVersion")
	}
}
